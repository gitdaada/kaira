<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://avoin-karttakuva.maanmittauslaitos.fi https://tile.openstreetmap.org; connect-src 'self' https://avoin-karttakuva.maanmittauslaitos.fi https://opendata.fmi.fi https://api.open-meteo.com https://api.met.no; font-src 'self'; worker-src 'self'; manifest-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Kaira</title>
  <meta name="description" content="Offline-kartta metsästykseen, kalastukseen ja eränkäyntiin">
  <meta name="theme-color" content="#1A2F25">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kaira">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/kaira.css">
</head>
<body>
  <div id="map" aria-label="Kartta"><div id="mapView"></div></div>

  <header class="topbar">
    <button id="sectionBtn" class="section-btn" type="button" aria-haspopup="dialog" aria-label="Vaihda osiota">
      <span id="sectionIcon" class="section-icon" aria-hidden="true"></span>
      <span class="section-txt"><span class="section-label">Osio</span><span id="sectionName" class="section-name">Kaira</span></span>
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="topbar-chips">
      <span id="netChip" class="chip chip-warn" hidden>Offline</span>
      <span id="gpsChip" class="chip" hidden></span>
    </div>
    <button id="sosBtn" class="sos-btn" type="button" aria-label="Hätäkoordinaatit">
      <span>SOS</span>
    </button>
  </header>

  <button id="wxCard" class="wx-card" type="button" aria-label="Sää ja ennuste" aria-haspopup="dialog"></button>
  <section id="targetCard" class="target-card" hidden aria-live="polite"></section>

  <nav class="fabs" aria-label="Karttatyökalut">
    <button id="compassBtn" class="fab fab-compass" type="button" aria-label="Käännä kartta katsomasuuntaan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l4 9.5h-8z" fill="#FF6B35"/><path d="M12 21.5l-4-9.5h8z" fill="currentColor" opacity="0.85"/></svg>
    </button>
    <button id="locateBtn" class="fab fab-locate" type="button" aria-label="Oma sijainti" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="fab-pair">
      <button id="zoomInBtn" class="fab fab-sq" type="button" aria-label="Lähennä"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
      <button id="zoomOutBtn" class="fab fab-sq" type="button" aria-label="Loitonna"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    </div>
  </nav>

  <section id="rainBar" class="rain-bar" hidden aria-label="Sadetutka">
    <div class="rain-top">
      <button id="rainPlay" class="rain-btn" type="button" aria-label="Toista sadetutka"></button>
      <input id="rainSlider" type="range" min="0" max="0" step="1" value="0" aria-label="Ennusteaika">
      <button id="rainNow" class="rain-now" type="button">Nyt</button>
      <button id="rainHide" class="rain-btn" type="button" aria-label="Sulje sadetutka">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="rain-info"><b id="rainTime">Sade</b> <span id="rainHere"></span></div>
  </section>

  <section id="measureBar" class="tool-bar" hidden aria-live="polite">
    <div id="measureText" class="tool-text">Napauta karttaa lisätäksesi pisteitä.</div>
    <div class="btn-row">
      <button id="measureUndo" type="button" class="btn">Peru</button>
      <button id="measureClear" type="button" class="btn">Tyhjennä</button>
      <button id="measureDone" type="button" class="btn btn-primary">Valmis</button>
    </div>
  </section>

  <section id="drawBar" class="tool-bar" hidden aria-live="polite">
    <div id="drawText" class="tool-text">Napauta alueen kulmapisteet kartalle.</div>
    <div class="btn-row">
      <button id="drawMode" type="button" class="btn" aria-pressed="false">Sormi</button>
      <button id="drawUndo" type="button" class="btn">Peru</button>
      <button id="drawClear" type="button" class="btn">Tyhjennä</button>
      <button id="drawCancel" type="button" class="btn">Lopeta</button>
      <button id="drawDone" type="button" class="btn btn-primary">Valmis</button>
    </div>
  </section>

  <section id="infoCard" class="info-card" hidden aria-live="polite"></section>

  <nav id="bottomNav" class="bottom-nav" aria-label="Päävalikko">
    <button id="navLayers" class="nav-btn" type="button" aria-haspopup="dialog"><span class="nav-ico" aria-hidden="true"></span><span class="nav-lbl">Tasot</span></button>
    <button id="navTools" class="nav-btn" type="button" aria-haspopup="dialog"><span class="nav-ico" aria-hidden="true"></span><span class="nav-lbl">Työkalut</span></button>
    <button id="navMain" class="nav-btn nav-main" type="button" aria-haspopup="dialog"><span class="nav-ico" aria-hidden="true"></span><span class="nav-lbl">Merkitse</span></button>
    <button id="navInfo" class="nav-btn" type="button" aria-haspopup="dialog"><span class="nav-ico" aria-hidden="true"></span><span class="nav-lbl">Tieto</span></button>
    <button id="navMenu" class="nav-btn" type="button" aria-haspopup="dialog"><span class="nav-ico" aria-hidden="true"></span><span class="nav-lbl">Valikko</span></button>
  </nav>

  <div id="backdrop" class="backdrop" hidden></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button id="sheetClose" class="icon-btn" type="button" aria-label="Sulje">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="sheetBody" class="sheet-body"></div>
  </section>

  <section id="start" class="start" hidden aria-labelledby="startTitle">
    <div class="start-inner">
      <img class="start-logo" src="icons/icon-192.png" alt="" width="72" height="72">
      <h1 id="startTitle" class="start-title">KAIRA</h1>
      <p class="start-sub">Valitse, mihin olet lähdössä.</p>
      <div id="startCards" class="start-cards"></div>
      <p class="start-foot">Voit vaihtaa osiota milloin tahansa yläpalkista.</p>
    </div>
  </section>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/rotate.js"></script>
  <script src="js/core.js"></script>
  <script src="js/jcore.js"></script>
  <script src="js/solmut.js"></script>
  <script src="js/kaira.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/hunt.js"></script>
  <script src="js/fish.js"></script>
  <script src="js/wild.js"></script>
  <script src="js/palo.js"></script>
  <script src="js/help.js"></script>
  <script src="js/main.js"></script>
</body>
</html>

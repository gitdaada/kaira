# Eränkäynti: kansallispuistot, luonnonpuistot ja valtion retkeilyalueet (docs/data/puistot.json, rajat ja kuvat).
# Kerran kuukaudessa sekä haun tai lisätietojen muuttuessa. Julkiset rajapinnat (Syke, OpenStreetMap, Wikidata,
# Wikimedia Commons), ei avaimia eikä salaisuuksia. Tulokset tallennetaan samaan haaraan, jossa ajo käynnistyi.
name: Puistot
on:
  schedule:
    - cron: "29 2 3 * *"
  workflow_dispatch:
  push:
    paths:
      - "pipeline/puistot.py"
      - "pipeline/data/puistot_lisat.json"
      - ".github/workflows/puistot.yml"
      - "tests/test_puistot.py"
permissions:
  contents: write
concurrency:
  group: puistot-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  paivita:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Asenna kirjastot
        run: |
          pip install --only-binary=:all: -r pipeline/requirements.txt
      - name: Lähdeaineiston välimuisti
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/puistot
          key: puistot-${{ github.run_id }}
          restore-keys: |
            puistot-
      - name: Testit
        run: python3 tests/test_puistot.py
      - name: Hae puistot
        run: python3 pipeline/puistot.py
      - name: Tallenna muutokset
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data/puistot.json docs/data/puistot docs/img/puistot
          git commit -m "Päivitä puistot" || exit 0
          for i in 1 2 3; do
            git pull --rebase -X theirs -q origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0
            sleep 10
          done
          exit 1

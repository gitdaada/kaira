# Metsästys ja eränkäynti: voimassa olevat maastopalovaroitukset (docs/data/maastopalo.json) Ilmatieteen laitoksen
# CAP-syötteestä: huhti–syyskuussa tunnin välein, loka–maaliskuussa kuuden tunnin välein (varoituksia ei juuri anneta;
# säästää Actions-minuutteja). Tiedosto tallennetaan vain, kun varoitukset muuttuvat. Ei avaimia eikä salaisuuksia.
name: Maastopalovaroitukset
on:
  schedule:
    - cron: "7 * * 4-9 *"            # huhti–syyskuu: tunnin välein (UTC)
    - cron: "7 */6 * 1-3,10-12 *"    # loka–maaliskuu: klo 00.07, 06.07, 12.07 ja 18.07 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pipeline/maastopalo.py"
      - ".github/workflows/maastopalo.yml"
permissions:
  contents: write
concurrency:
  group: maastopalo
  cancel-in-progress: false
jobs:
  paivita:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Hae varoitukset
        env:
          # Ajastetussa ajossa vain päivitys; käsin tai koodimuutoksesta lisäksi jäsennyksen tarkistus lokiin.
          DIAG: ${{ github.event_name != 'schedule' && '--diagnose' || '' }}
        run: python3 pipeline/maastopalo.py $DIAG
      - name: Tallenna muutokset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/maastopalo.json
          git commit -m "Maastopalovaroitukset päivitetty" || exit 0
          for i in 1 2 3; do
            git pull --rebase -X theirs -q origin main && git push && exit 0
            sleep 10
          done
          exit 1

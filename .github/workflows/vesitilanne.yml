# Kalastus: päivittää jokien vesitilanteen (docs/data/vesitilanne.json) kerran päivässä.
# Vain julkisia rajapintoja (Syke, Ilmatieteen laitos, OpenStreetMap), ei salaisuuksia eikä avaimia.
name: Vesitilanne
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pipeline/vesitilanne.py"
      - "pipeline/joet.json"
      - ".github/workflows/vesitilanne.yml"
permissions:
  contents: write
concurrency:
  group: vesitilanne
  cancel-in-progress: false
jobs:
  paivita:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Laske vesitilanne
        run: python3 pipeline/vesitilanne.py
      - name: Tallenna muutokset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/vesitilanne.json docs/layers/*-joet.geojson
          git commit -m "Vesitilanne päivitetty" || exit 0
          for i in 1 2 3; do
            git pull --rebase -X theirs -q origin main && git push && exit 0
            sleep 10
          done
          exit 1

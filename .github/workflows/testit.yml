# Testit jokaisessa muutoksessa: putkien laskenta ja sovelluksen laskentaydin. Vain lukuoikeus.
name: Testit
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/data/**"
      - "docs/layers/*-joet.geojson"
      - "docs/layers/*-syvyys.geojson"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Asenna kirjastot
        run: |
          pip install --only-binary=:all: -r pipeline/requirements.txt
      - name: Putkien testit
        run: |
          python3 tests/test_pipeline.py
          python3 tests/test_encoding.py
          python3 tests/test_cuts.py
          python3 tests/test_habitat.py
          python3 tests/test_marjat.py
          python3 tests/test_puistot.py
      - name: Laskentaytimen testit
        run: node tests/jcore.test.js
      - name: Cloudflare Pages -rajat (ilmaistaso)
        run: |
          big=$(find docs -type f -size +24M)
          if [ -n "$big" ]; then echo "::error::Yli 24 MiB tiedostoja (raja 25 MiB): $big"; exit 1; fi
          n=$(find docs -type f | wc -l)
          echo "Tiedostoja docs/-kansiossa: $n (raja 20000)"
          if [ "$n" -gt 19000 ]; then echo "::error::Tiedostoja liian monta: $n"; exit 1; fi
          if [ -d docs/functions ] || [ -d functions ] || [ -f wrangler.toml ] || [ -f docs/_worker.js ]; then
            echo "::error::Pages Functions tai Worker löytyi: tarkista kustannukset ennen käyttöönottoa"; exit 1
          fi
      - name: Riippuvuuksien haavoittuvuudet (pip-audit)
        run: |
          pip install --only-binary=:all: pip-audit==2.7.3
          pip-audit --no-deps -r pipeline/requirements.txt
